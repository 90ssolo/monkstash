# MonkStash on one VPS: the site (Next.js), HTTPS (Caddy), and optionally an onion mirror (Tor).
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml --profile onion up -d   (adds the onion mirror)
name: monkstash

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WALLET_URL: ${NEXT_PUBLIC_WALLET_URL:-}
        NEXT_PUBLIC_MONERO_NETWORK: ${NEXT_PUBLIC_MONERO_NETWORK:-mainnet}
        # Public source commit of this release (see /verify). Set when deploying:
        #   BUILD_COMMIT=<commit> docker compose -f deploy/docker-compose.yml --profile onion up -d --build
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    env_file: .env
    volumes:
      - web-data:/data
    restart: unless-stopped
    # Not read-only: Next.js writes its page cache when it refreshes pages (fees, donations).
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.8.4@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f
    depends_on: [web]
    # Only what the Caddyfile reads: Caddy never sees API keys or node settings.
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      ONION_LOCATION_HEADER: ${ONION_LOCATION_HEADER:-}
      STAGING_ROBOTS_HEADER: ${STAGING_ROBOTS_HEADER:-}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # A fixed address: Tor resolves its target once at start, so a recreated Caddy with a new
    # address would silently break the onion mirror. torrc points at this address.
    networks:
      default:
        ipv4_address: 172.30.77.10
    restart: unless-stopped

  tor:
    profiles: [onion]
    build:
      context: .
      dockerfile: Dockerfile.tor
    depends_on: [caddy]
    volumes:
      - tor-keys:/var/lib/tor
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.77.0/24

volumes:
  web-data:
  caddy-data:
  caddy-config:
  tor-keys:
