# Installs MonkStash Server on fresh Ubuntu machines (x86-64 and ARM64) with a stagenet node and
# checks what a user relies on: the official release is verified, the node syncs, HTTPS works,
# the web wallet may connect from a browser and other sites may not, the public port is the
# restricted RPC, the status page and command work, and re-install, update check and uninstall
# behave.
name: Server installer

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server-installer.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CA: /tmp/caddy-local-root.crt
      ORIGIN: https://wallet.monkstash.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Syntax and lint
        run: |
          bash -n server/monkstash-server.sh
          shellcheck -S warning server/monkstash-server.sh

      - name: Release signature
        # Every version of the script must be signed with the release key it names (see
        # scripts/sign-installer.sh); self-update refuses anything else.
        run: |
          key=$(sed -n 's/^RELEASE_KEY="\(.*\)"$/\1/p' server/monkstash-server.sh)
          printf 'release@monkstash.com namespaces="monkstash-server" %s\n' "$key" > /tmp/signers
          ssh-keygen -Y verify -f /tmp/signers -I release@monkstash.com -n monkstash-server \
            -s server/monkstash-server.sh.sig < server/monkstash-server.sh

      - name: Install (stagenet, local HTTPS)
        run: sudo bash server/monkstash-server.sh install --network stagenet --domain localhost --yes

      - name: Trust Caddy's local certificate for these tests
        run: |
          for i in $(seq 1 30); do sudo test -f /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt && break; sleep 2; done
          sudo cp /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt "$CA" && sudo chmod 0644 "$CA"

      - name: Node answers and syncs
        run: |
          info() { curl -fs http://127.0.0.1:38081/get_info; }
          # The node must answer RPC. If it never does, the install is broken: fail at once.
          for i in $(seq 1 60); do info > /dev/null && break; sleep 5; done
          info | jq -e '.status == "OK"' > /dev/null
          # Stagenet has few peers and only five hardcoded seed nodes, so finding them can take a
          # few minutes and a runner sometimes finds none. If the height has not moved after 120 s,
          # restart monerod once to retry the seeds, with a warning so the retry stays visible.
          h1=$(info | jq .height); h2=$h1
          for i in $(seq 1 30); do
            sleep 10
            j=$(info) || j='{}'
            h2=$(echo "$j" | jq '.height // 0')
            peers=$(echo "$j" | jq '.outgoing_connections_count // 0')
            known=$(echo "$j" | jq '(.white_peerlist_size // 0) + (.grey_peerlist_size // 0)')
            echo "after $((i * 10)) s: height $h2, peers $peers, known peers $known"
            [ "$h2" -gt "$h1" ] && [ "$h2" -gt 100 ] && break
            if [ "$i" -eq 12 ] && [ "$h2" -le "$h1" ]; then
              echo "::warning::No stagenet sync after 120 s; restarting monerod once to retry the seed nodes"
              sudo systemctl restart monerod
              for k in $(seq 1 30); do info > /dev/null && break; sleep 2; done
            fi
          done
          if [ "$h2" -le "$h1" ]; then
            echo "::error::monerod did not sync on stagenet; the end of its log follows"
            systemctl status monerod --no-pager || true
            sudo tail -n 80 /var/log/monero/monerod.log || true
            exit 1
          fi
          /opt/monero/current/monerod --version

      - name: Status command and page
        run: |
          monkstash-server status
          monkstash-server status --json | jq -e '.running == true and .network == "stagenet" and .pruned == true'
          sudo systemctl start monkstash-status.service
          curl -fsS --cacert "$CA" https://localhost/status | grep -q "Your Monero node"
          curl -fsS --cacert "$CA" https://localhost/status.json | jq -e '.height > 0'

      - name: HTTPS reaches the restricted RPC
        run: |
          curl -fsS --cacert "$CA" https://localhost/get_info | jq -e '.status == "OK" and .restricted == true'
          # An admin call is refused on the public port, and the node keeps running.
          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert "$CA" -X POST https://localhost/stop_daemon)
          echo "stop_daemon over HTTPS: $code"
          test "$code" != "200"
          sleep 3; systemctl is-active --quiet monerod

      - name: Browser access for the web wallet only
        run: |
          body='{"jsonrpc":"2.0","id":"0","method":"get_info"}'
          curl -sS --cacert "$CA" -D - -o /dev/null -X POST https://localhost/json_rpc -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -d "$body" \
            | tee /tmp/allowed.txt | grep -qi "^access-control-allow-origin: $ORIGIN"
          curl -sS --cacert "$CA" -D - -o /dev/null -X OPTIONS https://localhost/json_rpc -H "Origin: $ORIGIN" \
            -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' | tee /tmp/preflight.txt | grep -qi "^access-control-allow-origin: $ORIGIN"
          if curl -sS --cacert "$CA" -D - -o /dev/null -X POST https://localhost/json_rpc -H "Origin: https://other.example" -H 'Content-Type: application/json' -d "$body" \
            | grep -qi "^access-control-allow-origin: https://other.example"; then echo "another site was allowed"; exit 1; fi

      - name: Firewall
        run: |
          sudo ufw status | tee /tmp/ufw.txt
          grep -q "38080/tcp" /tmp/ufw.txt && grep -q "443/tcp" /tmp/ufw.txt && grep -qE "^Status: active" /tmp/ufw.txt

      - name: Running install again keeps the node
        run: |
          sudo monkstash-server install --yes
          sleep 5; systemctl is-active --quiet monerod
          grep -q 'NETWORK="stagenet"' /etc/monkstash-server/config

      - name: Update check
        run: sudo monkstash-server update --check

      - name: Uninstall keeps the blockchain unless asked
        run: |
          sudo monkstash-server uninstall
          ! systemctl is-active --quiet monerod
          test -d /var/lib/monero

  install-pay:
    # Node plus MonkStash Pay, with a throwaway stagenet shop wallet made only for this test (its
    # spend key was never kept; stagenet coins have no value).
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CA: /tmp/caddy-local-root.crt
      MONKSTASH_PAY_ADDRESS: 53GEHf6S6uNTpTUxe3Uck23miKbiDtpKZi6qvdXMGQ9PNJ6LeDRfa8eLZ7ozxw4jCf1qdRLCAom4K6amgWZDhsmSUTad2cr
      MONKSTASH_PAY_VIEW_KEY: ca3940e9c65968310caa23566cf6304df48ad71abb2d229ac89d2705cfa16008
      MONKSTASH_PAY_RESTORE_HEIGHT: "2200000"
      # Build MonkStash Pay from the commit under test, not the release pinned in the script.
      MONKSTASH_PAY_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install node and MonkStash Pay
        run: sudo -E bash server/monkstash-server.sh install --network stagenet --domain localhost --pay --shop-url https://shop.example --shop-name "Test shop" --yes

      - name: Trust Caddy's local certificate for these tests
        run: |
          for i in $(seq 1 30); do sudo test -f /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt && break; sleep 2; done
          sudo cp /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt "$CA" && sudo chmod 0644 "$CA"

      - name: Secrets stay on the server, readable by root only
        run: |
          test "$(sudo stat -c %a /etc/monkstash-server/pay.env)" = 600
          ! cat /etc/monkstash-server/pay.env 2> /dev/null
          ! sudo journalctl --no-pager -u monkstash-pay -u monerod -u caddy | grep -q "$MONKSTASH_PAY_VIEW_KEY"
          sudo monkstash-server pay-info | grep -q "API key:"

      - name: Pay answers and finishes its first scan
        run: |
          key=$(sudo sed -n 's/^PAY_API_KEY=//p' /etc/monkstash-server/pay.env)
          echo "::add-mask::$key"
          for i in $(seq 1 60); do
            h=$(curl -s -H "Authorization: Bearer $key" http://127.0.0.1:8080/api/health || true)
            echo "$h" | jq -e '.ok == true' > /dev/null 2>&1 && break
            sleep 10
          done
          echo "$h" | jq '{ok, network, height, syncError}'
          echo "$h" | jq -e '.ok == true and .network == "stagenet"'

      - name: Invoice and checkout over HTTPS
        run: |
          key=$(sudo sed -n 's/^PAY_API_KEY=//p' /etc/monkstash-server/pay.env)
          echo "::add-mask::$key"
          R="--resolve pay.localhost:443:127.0.0.1 --cacert $CA"
          code=$(curl -s -o /dev/null -w '%{http_code}' $R -X POST https://pay.localhost/api/invoices -H 'Content-Type: application/json' -d '{"amount":"0.05","currency":"XMR"}')
          echo "without the API key: $code"; test "$code" = 401
          inv=$(curl -fsS $R -X POST https://pay.localhost/api/invoices -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{"amount":"0.05","currency":"XMR","reference":"order-1"}')
          echo "$inv" | jq '{id, status, checkoutUrl}'
          url=$(echo "$inv" | jq -r .checkoutUrl)
          case "$url" in https://pay.localhost/pay/*) ;; *) echo "unexpected checkout URL $url"; exit 1 ;; esac
          curl -fsS $R "$url" | grep -qi "monero"
          curl -fsS $R "$url/qr.svg" | grep -q "<svg"

      - name: Payment links from the command line and over HTTPS
        run: |
          R="--resolve pay.localhost:443:127.0.0.1 --cacert $CA"
          sudo -E monkstash-server link new "Test donations" --currency XMR --min 0.01 --suggest 0.05,0.1 | tee /tmp/link.txt
          url=$(sed -n 's/^  Link: *//p' /tmp/link.txt)
          id=$(sed -n 's/^  Id: *//p' /tmp/link.txt)
          case "$url" in https://pay.localhost/l/*) ;; *) echo "unexpected link URL $url"; exit 1 ;; esac
          grep -q '<a href="https://pay.localhost/l/' /tmp/link.txt
          curl -fsS $R "$url" | grep -q "Test donations"
          curl -fsS $R "$url/qr.svg" | grep -q "<svg"
          loc=$(curl -sS $R -o /dev/null -w '%{redirect_url}' -X POST --data 'amount=0.05' "$url")
          echo "redirected to $loc"
          case "$loc" in https://pay.localhost/pay/*) ;; *) echo "unexpected redirect $loc"; exit 1 ;; esac
          curl -fsS $R "$loc" | grep -q "0.05"
          sudo -E monkstash-server link list | grep -q "Test donations"
          sudo -E monkstash-server link off "$id" | grep -q "switched off"
          test "$(curl -s $R -o /dev/null -w '%{http_code}' "$url")" = 410
          ! sudo -E monkstash-server link new "--amount" 2> /dev/null

      - name: Dashboard sign-in over HTTPS
        run: |
          key=$(sudo sed -n 's/^PAY_API_KEY=//p' /etc/monkstash-server/pay.env)
          echo "::add-mask::$key"
          R="--resolve pay.localhost:443:127.0.0.1 --cacert $CA"
          curl -fsS $R https://pay.localhost/admin | grep -q "Sign in"
          sudo monkstash-server pay-info | grep -q "https://pay.localhost/admin"
          jar=$(mktemp)
          code=$(curl -s $R -c "$jar" -o /dev/null -w '%{http_code}' -H "Origin: https://pay.localhost" --data-urlencode "key=$key" https://pay.localhost/admin/login)
          test "$code" = 303
          grep -q monkstash_admin "$jar"
          curl -fsS $R -b "$jar" https://pay.localhost/admin | grep -q "Overview"
          curl -fsS $R -b "$jar" "https://pay.localhost/admin/export.csv" | head -n 1 | grep -q "^invoice_id,"
          rm -f "$jar"

      - name: Status shows payments
        run: |
          sudo monkstash-server status | tee /tmp/status.txt
          grep -q "Payments:    MonkStash Pay ready" /tmp/status.txt

      - name: Uninstall removes Pay
        run: |
          sudo monkstash-server uninstall
          ! sudo docker ps --format '{{.Names}}' | grep -q monkstash-pay
          ! test -f /etc/monkstash-server/pay.env
