name: WooCommerce plugin

on:
  push:
    paths:
      - "integrations/woocommerce/**"
      - ".github/workflows/woocommerce-plugin.yml"
  pull_request:
    paths:
      - "integrations/woocommerce/**"
      - ".github/workflows/woocommerce-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l on every file
        run: |
          set -e
          find integrations/woocommerce/monkstash-pay -name '*.php' -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: integrations/woocommerce/monkstash-pay
          slug: monkstash-pay

  smoke:
    name: Orders on current WordPress and WooCommerce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Start WordPress with WooCommerce and the plugin
        working-directory: integrations/woocommerce
        run: npx --yes @wordpress/env@11.17.0 start
      - name: Run the order checks
        working-directory: integrations/woocommerce
        run: npx --yes @wordpress/env@11.17.0 run cli wp eval-file wp-content/monkstash-tests/smoke.php
